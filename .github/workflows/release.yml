name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-universal }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist/agentty
          cp target/release/agentty scripts/install.sh packaging/agentty.desktop packaging/agentty.png README.md LICENSE dist/agentty/
          tar -czf agentty-${{ matrix.name }}.tar.gz -C dist agentty

      - name: macOS app (universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=dist/agentty.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/agentty" \
            target/aarch64-apple-darwin/release/agentty target/x86_64-apple-darwin/release/agentty
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp packaging/macos/agentty.icns "$APP/Contents/Resources/"
          codesign --force --deep --sign - "$APP"   # ad-hoc signature; not notarized
          (cd dist && ditto -c -k --keepParent agentty.app ../agentty-macos-universal.zip)

      - name: Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist/agentty | Out-Null
          Copy-Item target/release/agentty.exe, README.md, LICENSE dist/agentty/
          Compress-Archive -Path dist/agentty/* -DestinationPath agentty-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: agentty-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum agentty-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" agentty-* SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "agentty $GITHUB_REF_NAME" --generate-notes
