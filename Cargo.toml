[package]
name = "agentty"
version = "0.1.0"
edition = "2021"
description = "A lightweight terminal built for running and supervising AI coding agents"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/premanand8800/agentty"
keywords = ["terminal", "ai", "agents", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
ab_glyph = "0.2"
alacritty_terminal = "0.26"
arboard = "3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "0.4"
toml = "0.9"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dock badge (Unity LauncherEntry API, read by Ubuntu Dock / Dash to Dock / KDE). Linux and BSDs only.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"
